name: Scraping Dofus Kamas

on:
  schedule:
    # Corre a las 00:00 UTC cada 5 días (días 1, 6, 11, 16, 21, 26, 31 del mes)
    - cron: '0 0 */5 * *'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Subir debug.html si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug.html
          if-no-files-found: ignore
          retention-days: 5

      - name: Commit y push si hay cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/kamas.csv
          git diff --staged --quiet || git commit -m "Actualización automática de datos de kamas"
          git push
